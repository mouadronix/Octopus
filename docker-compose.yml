services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src/backend/Octopus.Api
    command: dotnet run --urls http://0.0.0.0:5000
    ports:
      - "5000:5000"
    volumes:
      - ./:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  ui:
    image: node:22
    working_dir: /src/frontend/lovable-project-9b49f94a
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/src
    environment:
      API_TARGET: http://api:5000
    depends_on:
      - api

